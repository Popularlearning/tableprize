<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衆智 - 大衆文教集團</title>
    <!-- 引入 Confetti 特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-red: #8B0000;
            --gold: #FFD700;
            --dark-gold: #B8860B;
            --bg-color: #2a0000;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--primary-red) 100%);
            color: var(--gold);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        .header {
            text-align: center;
            margin-bottom: 4vh;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        .title {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 5px;
            background: linear-gradient(to bottom, #FFF8DC, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .draw-container {
            display: flex;
            gap: 5vw;
            margin-bottom: 6vh;
        }
        .zodiac-box {
            width: 350px;
            height: 420px;
            background: rgba(255, 215, 0, 0.05);
            border: 6px solid var(--dark-gold);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 160px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 215, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .zodiac-box::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 12px;
            pointer-events: none;
        }
        .zodiac-box.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--gold);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.08);
        }
        .zodiac-icon {
            line-height: 1;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }
        .zodiac-name {
            font-size: 60px;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .btn-group {
            display: flex;
            gap: 20px;
            height: 80px;
        }
        button {
            padding: 15px 60px;
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-red);
            background: linear-gradient(to bottom, #FFF8DC, var(--gold), var(--dark-gold));
            border: 3px solid #FFF8DC;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }
        button:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255,215,0,0.5);
            background: linear-gradient(to bottom, #FFFFFF, var(--gold));
        }
        button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        button:disabled {
            background: #444;
            color: #777;
            border-color: #555;
            cursor: not-allowed;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
            transform: scale(0.98);
        }

        /* Responsive scale */
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; letter-spacing: 2px; }
            .draw-container { flex-direction: column; gap: 20px; }
            .zodiac-box { width: 250px; height: 300px; font-size: 100px; }
            .zodiac-name { font-size: 40px; }
            button { font-size: 24px; padding: 12px 40px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">「衆智」成城，共創高峰</h1>
    </div>

    <div class="draw-container">
        <div class="zodiac-box" id="box1">
            <div class="zodiac-icon" id="icon1">❓</div>
            <div class="zodiac-name" id="name1">第一位</div>
        </div>
        <div class="zodiac-box" id="box2">
            <div class="zodiac-icon" id="icon2">❓</div>
            <div class="zodiac-name" id="name2">第二位</div>
        </div>
    </div>

    <div class="btn-group">
        <button id="drawBtn" onclick="startDraw()">開始抽獎</button>
        <button id="resetBtn" onclick="resetDraw()" style="display: none;">重新開始</button>
    </div>

    <script>
        const zodiacs = [
            { name: '鼠', icon: '🐭' }, { name: '牛', icon: '🐮' },
            { name: '虎', icon: '🐯' }, { name: '兔', icon: '🐰' },
            { name: '龍', icon: '🐲' }, { name: '蛇', icon: '🐍' },
            { name: '馬', icon: '🐴' }, { name: '羊', icon: '🐏' },
            { name: '猴', icon: '🐵' }, { name: '雞', icon: '🐔' },
            { name: '狗', icon: '🐶' }, { name: '豬', icon: '🐷' }
        ];

        let isDrawing = false;
        let availableZodiacs = [];

        function startDraw() {
            if (isDrawing) return;
            isDrawing = true;
            
            const drawBtn = document.getElementById('drawBtn');
            const resetBtn = document.getElementById('resetBtn');
            const boxes = document.querySelectorAll('.zodiac-box');
            
            drawBtn.disabled = true;
            drawBtn.innerText = "抽獎進行中...";
            resetBtn.style.display = 'none';
            boxes.forEach(box => box.classList.remove('active'));

            // 準備生肖池
            availableZodiacs = [...zodiacs]; 
            
            // 開始自動流程：先抽第一個
            spinBox(1, () => {
                // 停頓 0.5 秒後抽第二個
                setTimeout(() => {
                    spinBox(2, () => {
                        // 兩個都抽完，觸發完成效果
                        finalizeDraw();
                    });
                }, 500);
            });
        }

        function spinBox(boxNum, callback) {
            let counter = 0;
            const maxSpins = 25; // 模擬轉動約 2 秒 (25 * 80ms)
            const iconEl = document.getElementById(`icon${boxNum}`);
            const nameEl = document.getElementById(`name${boxNum}`);
            const boxEl = document.getElementById(`box${boxNum}`);

            let interval = setInterval(() => {
                // 視覺上快速跳動
                let tempZ = availableZodiacs[Math.floor(Math.random() * availableZodiacs.length)];
                iconEl.innerText = tempZ.icon;
                nameEl.innerText = tempZ.name;
                counter++;
                
                if (counter >= maxSpins) {
                    clearInterval(interval);
                    // 從池中抽出一個，確保下一個不重複
                    let index = Math.floor(Math.random() * availableZodiacs.length);
                    let result = availableZodiacs.splice(index, 1)[0];
                    
                    iconEl.innerText = result.icon;
                    nameEl.innerText = result.name;
                    boxEl.classList.add('active');

                    // 執行完成回呼函數
                    if (callback) callback();
                }
            }, 80);
        }

        function finalizeDraw() {
            triggerConfetti();
            const drawBtn = document.getElementById('drawBtn');
            drawBtn.style.display = 'none';
            drawBtn.innerText = "開始抽獎";
            
            const resetBtn = document.getElementById('resetBtn');
            resetBtn.style.display = 'block';
            resetBtn.disabled = false;
            
            isDrawing = false;
        }

        function resetDraw() {
            document.getElementById('icon1').innerText = '❓';
            document.getElementById('name1').innerText = '第一位';
            document.getElementById('icon2').innerText = '❓';
            document.getElementById('name2').innerText = '第二位';
            
            const boxes = document.querySelectorAll('.zodiac-box');
            boxes.forEach(box => box.classList.remove('active'));

            document.getElementById('drawBtn').style.display = 'block';
            document.getElementById('drawBtn').disabled = false;
            document.getElementById('resetBtn').style.display = 'none';
        }

        function triggerConfetti() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 45, spread: 360, ticks: 100, zIndex: 999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 60 * (timeLeft / duration);
                
                // 從左右兩側發射紙屑
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#FFD700', '#B8860B', '#FFF8DC', '#FF0000']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#FFD700', '#B8860B', '#FFF8DC', '#FF0000']
                }));
            }, 250);
        }
    </script>
</body>
</html>
