<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「衆」智成城，共創高峰 - 十二生肖大抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4A0000 0%, #8B0000 50%, #300000 100%);
            font-family: 'Noto Serif TC', serif;
            overflow: hidden;
            user-select: none;
        }

        /* Golden Text Effect */
        .text-gold {
            background: linear-gradient(to bottom, #FFF7D6 0%, #FFDF00 30%, #D4AF37 60%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        }

        /* Zodiac Card Style */
        .zodiac-card {
            width: 240px;
            height: 340px;
            background: radial-gradient(circle at center, #FFF4D2 0%, #E6B800 60%, #B38600 100%);
            border: 6px solid #FFE680;
            border-radius: 24px;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.5), 
                inset 0 0 20px rgba(139, 0, 0, 0.4),
                0 20px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 140px;
            font-weight: 900;
            color: #8B0000;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            position: relative;
            overflow: hidden;
            margin: 0 20px;
        }

        /* Inner border for card */
        .zodiac-card::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 2px dashed #8B0000;
            border-radius: 12px;
            opacity: 0.5;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; filter: brightness(2); }
            60% { transform: scale(1.1); filter: brightness(1.5); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        @keyframes shufflePulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        }

        .anim-pop {
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .anim-shuffle {
            animation: shufflePulse 0.1s infinite;
        }

        /* Button Style */
        .btn-gold {
            background: linear-gradient(to bottom, #FFDF00 0%, #D4AF37 100%);
            color: #4A0000;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 3rem;
            border-radius: 50px;
            border: 2px solid #FFF7D6;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.8);
            transition: all 0.3s ease;
            cursor: pointer;
            outline: none;
        }
        .btn-gold:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255,215,0,0.6);
            background: linear-gradient(to bottom, #FFF4D2 0%, #E6B800 100%);
        }
        .btn-gold:active {
            transform: translateY(2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
        .btn-gold:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* SVG Mountain Background */
        .mountain-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative">

    <!-- Confetti Canvas -->
    <canvas id="confetti" class="absolute inset-0 z-50 pointer-events-none"></canvas>

    <!-- Mountain Peaks Background -->
    <svg class="mountain-bg" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <!-- Back Mountain -->
        <path fill="rgba(100, 0, 0, 0.6)" d="M0,320 L0,150 L100,250 L250,50 L450,220 L600,80 L800,260 L1000,40 L1200,200 L1350,100 L1440,250 L1440,320 Z"></path>
        <!-- Mid Mountain -->
        <path fill="rgba(153, 101, 21, 0.4)" d="M0,320 L0,220 L150,120 L350,280 L550,100 L750,240 L950,90 L1150,270 L1300,150 L1440,280 L1440,320 Z"></path>
        <!-- Front Golden Mountain Base -->
        <path fill="url(#goldGradient)" d="M0,320 L0,280 L200,180 L400,300 L700,150 L900,280 L1100,160 L1300,290 L1440,240 L1440,320 Z"></path>
        <defs>
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#4A0000" stop-opacity="1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Main Content -->
    <div class="relative z-10 w-full h-full flex flex-col items-center justify-center pt-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-7xl font-black text-gold tracking-widest mb-4">「衆」智成城，共創高峰</h1>
            <h2 class="text-5xl font-bold text-gold opacity-90 tracking-wider">十二生肖大抽獎</h2>
        </div>

        <!-- Cards Display Area -->
        <div id="display-area" class="flex flex-row items-center justify-center min-h-[400px] mb-8 w-full px-10">
            <!-- Cards will be injected here via JavaScript -->
        </div>

        <!-- Controls -->
        <div class="h-24 flex items-center justify-center">
            <button id="btn-action" class="btn-gold tracking-widest" onclick="handleAction()">開始抽獎</button>
        </div>
    </div>

    <script>
        // --- Game State ---
        const ALL_ZODIACS = ['鼠', '牛', '虎', '兔', '龍', '蛇', '馬', '羊', '猴', '雞', '狗', '豬'];
        let pool = [...ALL_ZODIACS];
        let winners = [];
        let state = 0; // 0: Init, 1: Draw 1 Ready, 2: Draw 1 Done, 3: Draw 2 Ready, 4: Draw 2 Done
        let shuffleInterval = null;

        // --- DOM Elements ---
        const displayArea = document.getElementById('display-area');
        const btnAction = document.getElementById('btn-action');

        // --- Core Logic ---
        function handleAction() {
            if (state === 0) {
                startDraw(1);
            } else if (state === 2) {
                startDraw(2);
            } else if (state === 4) {
                resetDraw();
            }
        }

        function startDraw(drawNumber) {
            // Update State & UI
            state = drawNumber === 1 ? 1 : 3;
            btnAction.disabled = true;
            btnAction.innerText = "抽獎進行中...";

            // Create and inject Shuffle Card
            const shuffleCard = document.createElement('div');
            shuffleCard.className = 'zodiac-card anim-shuffle';
            
            // If it's the second draw, we append it next to the first winner
            displayArea.appendChild(shuffleCard);

            // Rapid Shuffle Effect
            shuffleInterval = setInterval(() => {
                const randomZodiac = pool[Math.floor(Math.random() * pool.length)];
                // Create text gradient effect inline for canvas/div compatibility
                shuffleCard.innerHTML = `<span style="background: -webkit-linear-gradient(#8B0000, #4A0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${randomZodiac}</span>`;
            }, 60);

            // Stop shuffling after 3 seconds and reveal
            setTimeout(() => {
                clearInterval(shuffleInterval);
                
                // Pick Winner
                const winIndex = Math.floor(Math.random() * pool.length);
                const winner = pool.splice(winIndex, 1)[0];
                winners.push(winner);

                // Morph Shuffle Card into Winner Card
                shuffleCard.className = 'zodiac-card anim-pop';
                shuffleCard.innerHTML = `<span style="background: -webkit-linear-gradient(#8B0000, #4A0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${winner}</span>`;
                
                // Fire Confetti
                triggerConfetti();

                // Update UI and State for next step
                btnAction.disabled = false;
                if (drawNumber === 1) {
                    state = 2;
                    btnAction.innerText = "抽出第二位";
                } else {
                    state = 4;
                    btnAction.innerText = "重新開始";
                }
            }, 3000);
        }

        function resetDraw() {
            pool = [...ALL_ZODIACS];
            winners = [];
            state = 0;
            displayArea.innerHTML = '';
            btnAction.innerText = "開始抽獎";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        // --- Confetti System ---
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const colors = ['#FFDF00', '#D4AF37', '#FF4500', '#FF0000', '#ffffff', '#FFD700'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            // Add bursts of confetti
            for (let i = 0; i < 200; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() * 200 - 100), // Burst from center horizontal
                    y: canvas.height / 2 + (Math.random() * 100 - 50), // Burst from center vertical
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: 0,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05
                });
            }
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2 + p.dx;
                p.dy += 0.2; // gravity
                p.y += p.dy;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                // Remove particles that fall off screen
                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
        }
        animateConfetti(); // Start animation loop
    </script>
</body>
</html>
